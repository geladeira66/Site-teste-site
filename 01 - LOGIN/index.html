<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <form id="loginForm">
    <div class="form-item">
      <label for="username">Nome de usuário</label>
      <div class="input-wrapper">
        <input type="text" id="username" autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false" data-lpignore="true">
      </div>
    </div>

    <div class="form-item">
      <label for="password">Senha</label>
      <div class="input-wrapper">
        <input type="password" id="password" autocomplete="off"
          autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true">
        <button type="button" id="eyeball" aria-label="Mostrar senha">
          <div class="eye"></div>
        </button>
        <div id="beam"></div>
      </div>
    </div>

    <button id="submit" type="submit">Entrar</button>
    <p id="message"></p>
  </form>

  <script src="login.js"></script>
</body>
</html>
